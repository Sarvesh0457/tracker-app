<svg viewBox="0 0 1500 980" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, system-ui, sans-serif" role="img">
  <title>Cricket Ball Tracker — Production Architecture</title>
  <desc>End-to-end architecture showing browser, Firebase Hosting frontend, Cloud Run API, Cloud Tasks queue, GPU worker, Firestore and GCS.</desc>

  <style>
    .title { font-size: 22px; font-weight: 700; fill: #1a2233; }
    .subtitle { font-size: 13px; fill: #5b6678; }
    .legend-text { font-size: 11px; fill: #2a3441; }
    .section-title { font-size: 13px; font-weight: 700; fill: #1a2233; }
    .box-title { font-size: 12px; font-weight: 700; fill: #1a2233; }
    .box-sub { font-size: 10.5px; fill: #5b6678; }
    .box-tag { font-size: 9.5px; font-weight: 600; }
    .bullet { font-size: 10px; fill: #2a3441; }
    .port { font-size: 10px; font-weight: 600; fill: #2d6a4f; }
    .step-num { font-size: 11px; font-weight: 700; fill: #fff; }
    .arrow-label { font-size: 10px; fill: #5b6678; font-style: italic; }
    .small { font-size: 10px; fill: #2a3441; }
    .th { font-size: 11px; font-weight: 700; fill: #1a2233; }
    .td { font-size: 10.5px; fill: #1a2233; }
    .sr { font-size: 12px; font-weight: 700; fill: #c1121f; }
  </style>

  <defs>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2d6a4f"/>
    </marker>
    <marker id="arrowDark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a2233"/>
    </marker>
  </defs>

  <rect width="1500" height="980" fill="#ffffff"/>

  <text x="750" y="32" text-anchor="middle" class="title">CRICKET BALL TRACKER — PRODUCTION ARCHITECTURE</text>
  <text x="750" y="52" text-anchor="middle" class="subtitle">What is deployed, in which container, and where it runs on GCP (project: sportsanalytics-495612)</text>

  <g transform="translate(20, 70)">
    <rect x="0" y="0" width="200" height="78" rx="6" fill="#fff" stroke="#d0d6df"/>
    <line x1="14" y1="20" x2="50" y2="20" stroke="#2563eb" stroke-width="2" marker-end="url(#arrowBlue)"/>
    <text x="58" y="24" class="legend-text">HTTPS / Web Traffic</text>
    <line x1="14" y1="40" x2="50" y2="40" stroke="#2d6a4f" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrowGreen)"/>
    <text x="58" y="44" class="legend-text">Internal Service Calls</text>
    <line x1="14" y1="60" x2="50" y2="60" stroke="#1a2233" stroke-width="2" stroke-dasharray="3,3" marker-end="url(#arrowDark)"/>
    <text x="58" y="64" class="legend-text">Storage / DB Access</text>
  </g>

  <g transform="translate(20, 220)">
    <rect x="0" y="0" width="130" height="200" rx="8" fill="#f3f5f9" stroke="#c1c8d3" stroke-width="1.5"/>
    <text x="65" y="22" text-anchor="middle" class="section-title">USERS</text>
    <rect x="25" y="40" width="80" height="55" rx="4" fill="#fff" stroke="#9aa4b3"/>
    <rect x="33" y="48" width="64" height="36" rx="2" fill="#eef1f6"/>
    <text x="65" y="110" text-anchor="middle" class="bullet">Web Browser</text>
    <rect x="42" y="130" width="46" height="62" rx="6" fill="#fff" stroke="#9aa4b3"/>
    <rect x="46" y="138" width="38" height="44" rx="2" fill="#eef1f6"/>
    <circle cx="65" cy="187" r="2" fill="#9aa4b3"/>
    <text x="65" y="206" text-anchor="middle" class="bullet">Mobile Browser</text>
  </g>

  <g transform="translate(165, 290)">
    <ellipse cx="40" cy="30" rx="40" ry="22" fill="#dbe9ff" stroke="#7da3d8"/>
    <text x="40" y="34" text-anchor="middle" class="box-title" fill="#1d4e89">INTERNET</text>
  </g>

  <line x1="150" y1="320" x2="165" y2="320" stroke="#2563eb" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <line x1="245" y1="320" x2="275" y2="320" stroke="#2563eb" stroke-width="2" marker-end="url(#arrowBlue)"/>

  <rect x="275" y="100" width="975" height="640" rx="10" fill="#fafbfc" stroke="#4285f4" stroke-width="2"/>
  <text x="762" y="125" text-anchor="middle" class="section-title" fill="#1a73e8">GOOGLE CLOUD — sportsanalytics-495612 (us-central1)</text>
  <text x="762" y="142" text-anchor="middle" class="box-sub">Serverless containers · Scale-to-zero · IAM-bound service accounts</text>

  <g transform="translate(295, 170)">
    <rect x="0" y="0" width="200" height="180" rx="8" fill="#fff" stroke="#34a853" stroke-width="1.8"/>
    <circle cx="20" cy="20" r="11" fill="#34a853"/>
    <text x="20" y="24" text-anchor="middle" class="step-num">1</text>
    <text x="105" y="24" text-anchor="middle" class="box-title">tracker-frontend</text>
    <text x="105" y="40" text-anchor="middle" class="box-sub">Firebase Hosting</text>
    <rect x="65" y="50" width="80" height="20" rx="10" fill="#e7f5ec" stroke="#34a853"/>
    <text x="105" y="64" text-anchor="middle" class="box-tag" fill="#1e7e34">Frontend</text>
    <text x="105" y="90" text-anchor="middle" class="box-sub" font-weight="600">React + Vite + TS</text>
    <text x="14" y="112" class="bullet">• Upload step (XHR)</text>
    <text x="14" y="128" class="bullet">• Calibration canvas</text>
    <text x="14" y="144" class="bullet">• Review + Analyze</text>
    <text x="14" y="160" class="bullet">• Job poll + results</text>
    <rect x="50" y="168" width="100" height="10" rx="2" fill="#e7f5ec"/>
    <text x="100" y="176" text-anchor="middle" class="port">.web.app · CDN</text>
  </g>

  <g transform="translate(520, 170)">
    <rect x="0" y="0" width="200" height="180" rx="8" fill="#fff" stroke="#fbbc04" stroke-width="1.8"/>
    <circle cx="20" cy="20" r="11" fill="#fbbc04"/>
    <text x="20" y="24" text-anchor="middle" class="step-num">2</text>
    <text x="105" y="24" text-anchor="middle" class="box-title">tracker-api</text>
    <text x="105" y="40" text-anchor="middle" class="box-sub">Cloud Run (CPU)</text>
    <rect x="73" y="50" width="65" height="20" rx="10" fill="#fef7e0" stroke="#fbbc04"/>
    <text x="105" y="64" text-anchor="middle" class="box-tag" fill="#a17c00">Backend</text>
    <text x="105" y="90" text-anchor="middle" class="box-sub" font-weight="600">FastAPI · Python 3.11</text>
    <text x="14" y="112" class="bullet">• First-frame extract</text>
    <text x="14" y="128" class="bullet">• Calibration suggest</text>
    <text x="14" y="144" class="bullet">• Enqueue Cloud Task</text>
    <text x="14" y="160" class="bullet">• Mint signed URLs</text>
    <rect x="50" y="168" width="100" height="10" rx="2" fill="#fef7e0"/>
    <text x="100" y="176" text-anchor="middle" class="port">Port 8080 · 1 CPU · 512Mi</text>
  </g>

  <g transform="translate(745, 170)">
    <rect x="0" y="0" width="200" height="180" rx="8" fill="#fff" stroke="#4285f4" stroke-width="1.8"/>
    <circle cx="20" cy="20" r="11" fill="#4285f4"/>
    <text x="20" y="24" text-anchor="middle" class="step-num">3</text>
    <text x="105" y="24" text-anchor="middle" class="box-title">tracker-jobs queue</text>
    <text x="105" y="40" text-anchor="middle" class="box-sub">Cloud Tasks</text>
    <rect x="60" y="50" width="90" height="20" rx="10" fill="#e8f0fe" stroke="#4285f4"/>
    <text x="105" y="64" text-anchor="middle" class="box-tag" fill="#1a5fbf">Mailbox</text>
    <text x="105" y="90" text-anchor="middle" class="box-sub" font-weight="600">HTTP task · OIDC token</text>
    <text x="14" y="112" class="bullet">• POST /process</text>
    <text x="14" y="128" class="bullet">• max attempts: 3</text>
    <text x="14" y="144" class="bullet">• concurrency: 1</text>
    <text x="14" y="160" class="bullet">• exp. backoff retry</text>
    <rect x="50" y="168" width="100" height="10" rx="2" fill="#e8f0fe"/>
    <text x="100" y="176" text-anchor="middle" class="port">SA: worker-invoker</text>
  </g>

  <g transform="translate(970, 170)">
    <rect x="0" y="0" width="220" height="180" rx="8" fill="#fff" stroke="#ea4335" stroke-width="1.8"/>
    <circle cx="20" cy="20" r="11" fill="#ea4335"/>
    <text x="20" y="24" text-anchor="middle" class="step-num">4</text>
    <text x="115" y="24" text-anchor="middle" class="box-title">tracker-worker</text>
    <text x="115" y="40" text-anchor="middle" class="box-sub">Cloud Run (L4 GPU)</text>
    <rect x="83" y="50" width="65" height="20" rx="10" fill="#fce8e6" stroke="#ea4335"/>
    <text x="115" y="64" text-anchor="middle" class="box-tag" fill="#a82e23">Pipeline</text>
    <text x="115" y="90" text-anchor="middle" class="box-sub" font-weight="600">FastAPI · ONNX Runtime GPU</text>
    <text x="14" y="112" class="bullet">• Pulls input.mp4 from GCS</text>
    <text x="14" y="128" class="bullet">• Detection + tracking (ONNX)</text>
    <text x="14" y="144" class="bullet">• Annotated video + CSV + JSON</text>
    <text x="14" y="160" class="bullet">• Writes status to Firestore</text>
    <rect x="55" y="168" width="110" height="10" rx="2" fill="#fce8e6"/>
    <text x="110" y="176" text-anchor="middle" class="port">Port 8080 · L4 GPU · 16Gi</text>
  </g>

  <line x1="495" y1="260" x2="520" y2="260" stroke="#2563eb" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <line x1="720" y1="260" x2="745" y2="260" stroke="#2d6a4f" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrowGreen)"/>
  <line x1="945" y1="260" x2="970" y2="260" stroke="#2d6a4f" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrowGreen)"/>

  <rect x="295" y="380" width="895" height="40" rx="6" fill="#eef2f9" stroke="#9aa4b3"/>
  <text x="742" y="406" text-anchor="middle" class="section-title">SHARED DATA PLANE — Firestore (metadata) · GCS (videos) · Cloud Tasks (queue)</text>

  <g transform="translate(335, 450)">
    <rect x="0" y="0" width="240" height="160" rx="8" fill="#fff" stroke="#ff9100" stroke-width="1.6"/>
    <text x="120" y="22" text-anchor="middle" class="box-title">Cloud Firestore (Native)</text>
    <text x="120" y="38" text-anchor="middle" class="box-sub">jobs collection — one doc per job</text>
    <line x1="20" y1="48" x2="220" y2="48" stroke="#e0e4eb"/>
    <text x="14" y="64" class="bullet">job_id · status · progress</text>
    <text x="14" y="78" class="bullet">user_id (X-Client-Id UUID)</text>
    <text x="14" y="92" class="bullet">upload_id · calibration · ball_type</text>
    <text x="14" y="106" class="bullet">result (schema-v1 JSON)</text>
    <text x="14" y="120" class="bullet">cancel_requested (polled by worker)</text>
    <text x="14" y="138" class="bullet" font-style="italic">Index: (user_id ASC, created_at DESC)</text>
    <text x="14" y="154" class="bullet" font-weight="600">No Cloud SQL · No tables · No Postgres</text>
  </g>

  <g transform="translate(610, 450)">
    <rect x="0" y="0" width="270" height="160" rx="8" fill="#fff" stroke="#0f9d58" stroke-width="1.6"/>
    <text x="135" y="22" text-anchor="middle" class="box-title">Cloud Storage</text>
    <text x="135" y="38" text-anchor="middle" class="box-sub">gs://sportsanalytics-495612-clips</text>
    <line x1="20" y1="48" x2="250" y2="48" stroke="#e0e4eb"/>
    <text x="14" y="64" class="bullet"><tspan font-weight="600">uploads/{upload_id}/</tspan></text>
    <text x="22" y="78" class="bullet">— input.mp4 · first_frame.jpg</text>
    <text x="14" y="94" class="bullet"><tspan font-weight="600">jobs/{job_id}/</tspan></text>
    <text x="22" y="108" class="bullet">— input.mp4 · first_frame.jpg</text>
    <text x="22" y="122" class="bullet">— output.mp4 · detections.csv</text>
    <text x="22" y="136" class="bullet">— results.json</text>
    <text x="135" y="152" text-anchor="middle" class="bullet" font-style="italic">v4 signed URLs (TTL 1h)</text>
  </g>

  <g transform="translate(915, 450)">
    <rect x="0" y="0" width="265" height="160" rx="8" fill="#fff" stroke="#5f6368" stroke-width="1.6"/>
    <text x="132" y="22" text-anchor="middle" class="box-title">IAM · Service Accounts</text>
    <text x="132" y="38" text-anchor="middle" class="box-sub">least-privilege per role</text>
    <line x1="20" y1="48" x2="245" y2="48" stroke="#e0e4eb"/>
    <text x="14" y="64" class="bullet"><tspan font-weight="600">api-sa</tspan> → Firestore, Tasks enqueuer,</text>
    <text x="22" y="78" class="bullet">GCS objectAdmin, tokenCreator (self),</text>
    <text x="22" y="92" class="bullet">serviceAccountUser on worker-invoker</text>
    <text x="14" y="108" class="bullet"><tspan font-weight="600">worker-sa</tspan> → Firestore, GCS objectAdmin</text>
    <text x="14" y="124" class="bullet"><tspan font-weight="600">worker-invoker</tspan> → run.invoker on worker</text>
    <text x="132" y="148" text-anchor="middle" class="bullet" font-style="italic">IAM Credentials API · Artifact Registry</text>
  </g>

  <line x1="620" y1="350" x2="475" y2="450" stroke="#1a2233" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arrowDark)"/>
  <line x1="620" y1="350" x2="700" y2="450" stroke="#1a2233" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arrowDark)"/>
  <line x1="1080" y1="350" x2="800" y2="450" stroke="#1a2233" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arrowDark)"/>
  <line x1="1080" y1="350" x2="510" y2="450" stroke="#1a2233" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arrowDark)"/>

  <g transform="translate(295, 630)">
    <rect x="0" y="0" width="475" height="100" rx="6" fill="#f4ebff" stroke="#7e3af2"/>
    <text x="12" y="20" class="section-title" fill="#5b21b6">ANALYZE FLOW (5 hops)</text>
    <text x="12" y="40" class="bullet"><tspan font-weight="700">1</tspan>  Browser POSTs video → API extracts first frame, saves to GCS uploads/</text>
    <text x="12" y="56" class="bullet"><tspan font-weight="700">2</tspan>  Browser POSTs calibration → API copies to jobs/, creates Firestore doc</text>
    <text x="12" y="72" class="bullet"><tspan font-weight="700">3</tspan>  API enqueues Cloud Task with OIDC token for worker-invoker SA</text>
    <text x="12" y="88" class="bullet"><tspan font-weight="700">4</tspan>  Worker scales up · pulls input from GCS · runs ONNX pipeline on L4 GPU</text>
  </g>

  <g transform="translate(785, 630)">
    <rect x="0" y="0" width="405" height="100" rx="6" fill="#e7f5ec" stroke="#0f9d58"/>
    <text x="12" y="20" class="section-title" fill="#1e7e34">RESULTS DELIVERY</text>
    <text x="12" y="40" class="bullet"><tspan font-weight="700">5</tspan>  Worker writes output.mp4 + CSV + JSON to GCS,</text>
    <text x="24" y="56" class="bullet">updates Firestore status=done.</text>
    <text x="12" y="74" class="bullet"><tspan font-weight="700">6</tspan>  Browser polls /jobs/{id} via API; on done, API</text>
    <text x="24" y="90" class="bullet">mints fresh v4 signed URLs (1h TTL) and returns them.</text>
  </g>

  <g transform="translate(20, 760)">
    <text x="0" y="0" class="section-title">SERVICE SUMMARY</text>
    <rect x="0" y="10" width="1460" height="22" fill="#eef2f9" stroke="#c1c8d3"/>
    <text x="10" y="26" class="th">#</text>
    <text x="40" y="26" class="th">Service</text>
    <text x="200" y="26" class="th">Type</text>
    <text x="320" y="26" class="th">Runtime</text>
    <text x="540" y="26" class="th">Resources</text>
    <text x="730" y="26" class="th">Public URL / Path</text>
    <text x="1100" y="26" class="th">Service Account</text>
    <text x="1290" y="26" class="th">Revision</text>

    <g transform="translate(0, 36)">
      <rect x="0" y="0" width="1460" height="22" fill="#fff" stroke="#e0e4eb"/>
      <text x="10" y="15" class="td">1</text>
      <text x="40" y="15" class="td">tracker-frontend</text>
      <text x="200" y="15" class="td">Static SPA</text>
      <text x="320" y="15" class="td">React 18 · Vite · TS</text>
      <text x="540" y="15" class="td">CDN cached</text>
      <text x="730" y="15" class="td">sportsanalytics-495612.web.app</text>
      <text x="1100" y="15" class="td">— (anonymous)</text>
      <text x="1290" y="15" class="td">Firebase Hosting</text>
    </g>
    <g transform="translate(0, 58)">
      <rect x="0" y="0" width="1460" height="22" fill="#fafbfc" stroke="#e0e4eb"/>
      <text x="10" y="15" class="td">2</text>
      <text x="40" y="15" class="td">tracker-api</text>
      <text x="200" y="15" class="td">Cloud Run (CPU)</text>
      <text x="320" y="15" class="td">FastAPI · Python 3.11</text>
      <text x="540" y="15" class="td">1 vCPU · 512 Mi · max 1 inst</text>
      <text x="730" y="15" class="td">tracker-api-106171733624.us-central1.run.app</text>
      <text x="1100" y="15" class="td">api-sa</text>
      <text x="1290" y="15" class="td">tracker-api-00011-92r</text>
    </g>
    <g transform="translate(0, 80)">
      <rect x="0" y="0" width="1460" height="22" fill="#fff" stroke="#e0e4eb"/>
      <text x="10" y="15" class="td">3</text>
      <text x="40" y="15" class="td">tracker-jobs (queue)</text>
      <text x="200" y="15" class="td">Cloud Tasks</text>
      <text x="320" y="15" class="td">HTTP target · OIDC auth</text>
      <text x="540" y="15" class="td">max-attempts 3, concurrency 1</text>
      <text x="730" y="15" class="td">projects/.../queues/tracker-jobs (us-central1)</text>
      <text x="1100" y="15" class="td">worker-invoker (OIDC)</text>
      <text x="1290" y="15" class="td">—</text>
    </g>
    <g transform="translate(0, 102)">
      <rect x="0" y="0" width="1460" height="22" fill="#fafbfc" stroke="#e0e4eb"/>
      <text x="10" y="15" class="td">4</text>
      <text x="40" y="15" class="td">tracker-worker</text>
      <text x="200" y="15" class="td">Cloud Run (GPU)</text>
      <text x="320" y="15" class="td">FastAPI · ONNX Runtime GPU</text>
      <text x="540" y="15" class="td">4 vCPU · 16 Gi · L4 · max 1 inst</text>
      <text x="730" y="15" class="td">tracker-worker-106171733624.us-central1.run.app</text>
      <text x="1100" y="15" class="td">worker-sa</text>
      <text x="1290" y="15" class="td">tracker-worker-00005-x8g</text>
    </g>
    <g transform="translate(0, 124)">
      <rect x="0" y="0" width="1460" height="22" fill="#fff" stroke="#e0e4eb"/>
      <text x="10" y="15" class="td">D</text>
      <text x="40" y="15" class="td">Firestore (jobs)</text>
      <text x="200" y="15" class="td">Native NoSQL</text>
      <text x="320" y="15" class="td">document store</text>
      <text x="540" y="15" class="td">1 collection · 1 composite index</text>
      <text x="730" y="15" class="td">(default) database · jobs collection</text>
      <text x="1100" y="15" class="td">api-sa + worker-sa</text>
      <text x="1290" y="15" class="td">multi-region</text>
    </g>
    <g transform="translate(0, 146)">
      <rect x="0" y="0" width="1460" height="22" fill="#fafbfc" stroke="#e0e4eb"/>
      <text x="10" y="15" class="td">D</text>
      <text x="40" y="15" class="td">GCS clips bucket</text>
      <text x="200" y="15" class="td">Cloud Storage</text>
      <text x="320" y="15" class="td">object store</text>
      <text x="540" y="15" class="td">uploads/ + jobs/ prefixes</text>
      <text x="730" y="15" class="td">gs://sportsanalytics-495612-clips</text>
      <text x="1100" y="15" class="td">api-sa + worker-sa</text>
      <text x="1290" y="15" class="td">us-central1</text>
    </g>
  </g>

  <g transform="translate(20, 935)">
    <rect x="0" y="0" width="1460" height="30" rx="4" fill="#fdecec" stroke="#c1121f"/>
    <text x="10" y="20" class="sr">PRODUCTION RULES</text>
    <text x="160" y="20" class="td">• Anonymous identity via X-Client-Id UUID  • No Cloud SQL dependency  • Worker scales to zero  • Signed URLs short-lived (1h)  • All inter-service calls OIDC-authed</text>
  </g>
</svg>
